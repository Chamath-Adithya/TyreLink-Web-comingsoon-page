<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TyreLink - Coming Soon | www.tyrelink.lk</title>
  <meta name="description" content="TyreLink PVT (LTD) - Sri Lanka. Coming Soon." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Noto+Sans+Sinhala:wght@500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Curved dynamic background ribbons and tire tread lines matching the banner -->
  <div class="bg-layer tread-track-1"></div>
  <div class="bg-layer tread-track-2"></div>
  <div class="bg-layer ribbon-grey"></div>
  <div class="bg-layer ribbon-red"></div>

  <main class="page-container">
    <div class="card-wrapper">
      
      <!-- Brand Logo Section -->
      <div class="logo-box">
        <div class="logo-icon-wrap">
          <!-- TyreLink curved wing / road tire arch icon matching official branding -->
          <svg class="brand-symbol" viewBox="0 0 100 65" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 58 C 22 28, 55 12, 95 8 C 65 17, 35 34, 18 58 Z" fill="#d91b1b"/>
            <path d="M16 58 C 30 33, 62 20, 95 18 C 70 26, 44 40, 28 58 Z" fill="#d91b1b"/>
            <path d="M26 58 C 39 39, 68 30, 95 28 C 74 36, 52 46, 38 58 Z" fill="#d91b1b"/>
          </svg>
        </div>
        <div class="brand-text">
          <span class="logo-tyre">TYRE</span><span class="logo-link">LINK</span>
        </div>
      </div>

      <!-- Sinhala Official Slogan from Banner -->
      <div class="sinhala-tagline">
        <span class="motto-item">විශ්වාසය</span>
        <span class="motto-divider">|</span>
        <span class="motto-item highlight">වගකීම</span>
        <span class="motto-divider">|</span>
        <span class="motto-item">කල්පැවැත්ම</span>
      </div>

      <div class="divider-line">
        <span class="sub-sinhala">තහවුරු කළ හොඳම තත්වය</span>
      </div>

      <!-- Categories Subtitle -->
      <p class="service-categories">
        TYRE &bull; TUBE &bull; ACCESSORIES &bull; BATTERIES
      </p>

      <!-- COMING SOON Badge / Title -->
      <div class="coming-soon-box">
        <h1 class="coming-soon-text">COMING SOON</h1>
        <div class="status-indicator">
          <span class="dot"></span>
          <span>WEBSITE UNDER CONSTRUCTION</span>
        </div>
      </div>

      <!-- Company Identity & Domain -->
      <div class="company-footer">
        <p class="company-name">TYRELINK PVT (LTD)</p>
        <p class="domain-tag">www.tyrelink.lk</p>
      </div>

    </div>
  </main>
</body>
</html>
