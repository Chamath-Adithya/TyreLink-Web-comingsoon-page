<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>TyreLink - Coming Soon | www.tyrelink.lk</title>
  <meta name="description" content="TyreLink PVT (LTD) - Sri Lanka's premier tyre marketplace. Launching soon." />

  <!-- Favicon for Browser Tabs -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=4" />
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=4" />
  <link rel="apple-touch-icon" sizes="192x192" href="favicon-192x192.png?v=4" />

  <!-- Open Graph & WhatsApp Preview Tags (Exact WhatsApp Spec) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TyreLink Sri Lanka" />
  <meta property="og:url" content="https://tyrelink.lk/" />
  <meta property="og:title" content="TyreLink - Coming Soon" />
  <meta property="og:description" content="TyreLink PVT (LTD) Sri Lanka is launching soon. Tyres, Tubes, Batteries & Automotive Solutions." />
  <meta property="og:image" content="https://tyrelink.lk/whatsapp-card.jpg" />
  <meta property="og:image:secure_url" content="https://tyrelink.lk/whatsapp-card.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="315" />
  <meta property="og:image:alt" content="TyreLink Sri Lanka" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TyreLink - Coming Soon" />
  <meta name="twitter:description" content="TyreLink PVT (LTD) Sri Lanka. Coming Soon." />
  <meta name="twitter:image" content="https://tyrelink.lk/whatsapp-card.jpg" />

  <!-- Google Font: Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css?v=3.0" />
</head>
<body>
  <!-- Ambient floating decorative glows -->
  <div class="glow-orb orb-red"></div>
  <div class="glow-orb orb-light"></div>

  <!-- Dynamic background curves and tyre tracks -->
  <div class="bg-layer tread-track-1"></div>
  <div class="bg-layer tread-track-2"></div>
  <div class="bg-layer ribbon-grey"></div>
  <div class="bg-layer ribbon-red"></div>

  <!-- Main Showcase Container -->
  <main class="page-container">
    <div class="glass-card">
      <div class="glass-reflection"></div>
      
      <!-- Official TyreLink Logo -->
      <div class="logo-box">
        <picture>
          <source srcset="tyrelink-logo.webp" type="image/webp" />
          <img 
            src="tyrelink-logo.png" 
            alt="TyreLink Sri Lanka Logo" 
            class="brand-logo-img" 
            width="1564" 
            height="363"
            loading="eager"
            fetchpriority="high"
          />
        </picture>
      </div>

      <!-- Glowing COMING SOON Banner -->
      <div class="coming-soon-wrapper">
        <div class="coming-soon-badge">
          <span class="live-dot"></span>
          <span>WEBSITE UNDER CONSTRUCTION</span>
        </div>
        <h1 class="coming-soon-title">COMING SOON</h1>
      </div>

      <!-- Minimal Brand Footer -->
      <footer class="brand-footer">
        <span class="company-name">TYRELINK PVT (LTD)</span>
        <span class="footer-divider">&bull;</span>
        <a href="https://tyrelink.lk" class="domain-link">www.tyrelink.lk</a>
      </footer>

    </div>
  </main>
</body>
</html>
